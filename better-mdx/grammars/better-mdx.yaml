# Better MDX Grammar Definition
# This YAML file defines the syntax highlighting patterns for Better MDX files
# It will be compiled to tmLanguage.json format for VS Code and other editors

name: Better-mdx
scopeName: source.better-mdx
fileTypes: [bettermdx, bmdx]

# Variables for reusable regex patterns
variables:
  # JSX patterns (simplified)
  jsxTagOrAtrributeIdentifier: '[_$[:alpha:]][-_$[:alnum:].]*'
  jsxTagNamespace: '(?:({{jsxTagOrAtrributeIdentifier}})(?<!\\.|-)(:))?'
  jsxTagName: '\\s*{{jsxTagNamespace}}((?:[a-z][a-z0-9]*|({{jsxTagOrAtrributeIdentifier}}))(?<!\\.|-))'
  jsxOpeningTagWithoutAttributes: '(<){{jsxTagName}}?\\s*(>)'
  jsxClosingTag: '(</){{jsxTagName}}?\\s*(>)'
  jsxTagStart: '(<){{jsxTagName}}(?=((<\\s*)|(\\s+))(?!\\?)|/?>)'
  jsxTagStartLookahead: '(?={{jsxTagStart}})'
  jsxLookBehindInExpression: '(?<!\\+\\+|--)(?<=[({\\[,?=>:*]|&&|\\|\\||\\?|\\*/|^)\\s*'

# Main patterns array - these are matched in order
patterns:
  # Include all the pattern groups defined in the repository
  - include: '#function_declarations'
  - include: '#interpolation'
  - include: '#expressions'
  - include: '#imports'
  - include: '#markdown'
  - include: '#comments'
  - include: '#strings'
  - include: '#keywords'

# Repository of named patterns
repository:

  # String interpolation patterns {{ }}
  interpolation:
    name: meta.interpolation.better-mdx
    begin: '\\{\\{'
    end: '\\}\\}'
    beginCaptures:
      '0': { name: punctuation.definition.interpolation.begin.better-mdx }
    endCaptures:
      '0': { name: punctuation.definition.interpolation.end.better-mdx }
    patterns:
      - include: '#typescript_expressions'

  # JavaScript expressions { }
  expressions:
    name: meta.expression.better-mdx
    begin: '\\{(?!\\{)'
    end: '\\}'
    beginCaptures:
      '0': { name: punctuation.definition.expression.begin.better-mdx }
    endCaptures:
      '0': { name: punctuation.definition.expression.end.better-mdx }
    patterns:
      - include: '#typescript_expressions'

  # TypeScript expressions within MDX
  typescript_expressions:
    name: source.ts.better-mdx
    patterns:
      - include: '#jsx'
      - include: '#ternary_operators'
      - include: '#function_calls'
      - include: '#variable_references'
      - include: '#strings'
      - include: '#comments'
      - include: '#keywords'

  # Function declarations
  function_declarations:
    name: meta.function.declaration.better-mdx
    begin: '\\b(function|const|let|var)\\s+([a-zA-Z_$][a-zA-Z0-9_$]*)\\s*\\('
    end: '^\\}'
    beginCaptures:
      '1': { name: keyword.control.better-mdx }
      '2': { name: entity.name.function.better-mdx }
    patterns:
      - include: '#parameter_list'
      - include: '#type_annotations'
      - include: '#function_body'

  # Function body content
  function_body:
    name: source.ts.better-mdx
    begin: '\\{'
    end: '(?=^\\})'
    patterns:
      - include: '#variable_declarations'
      - include: '#return_statement'
      - include: '#comments'
      - include: '#strings'
      - include: '#keywords'
      - include: '#typescript_expressions'

  # Variable declarations
  variable_declarations:
    name: meta.variable.declaration.better-mdx
    match: '^(const|let|var)\\s+([a-zA-Z_$][a-zA-Z0-9_$]*)\\s*[=:]'
    captures:
      '1': { name: keyword.control.better-mdx }
      '2': { name: variable.other.better-mdx }

  # Return statement
  return_statement:
    name: meta.return.statement.better-mdx
    begin: '^\\s*return\\s*\\('
    end: '^\\)'
    beginCaptures:
      '0': { name: keyword.control.return.better-mdx }
    patterns:
      - include: '#markdown'
      - include: '#interpolation'
      - include: '#expressions'
      - include: '#jsx'

  # Import statements
  imports:
    name: meta.import.better-mdx
    begin: '\\bimport\\b'
    end: ';'
    beginCaptures:
      '0': { name: keyword.control.import.better-mdx }

  # Markdown syntax
  markdown:
    patterns:
      - include: '#headers'
      - include: '#bold_text'
      - include: '#italic_text'
      - include: '#code_blocks'
      - include: '#inline_code'

  # Headers
  headers:
    name: markup.heading.better-mdx
    match: '^(#{1,6})\\s+(.+)$'
    captures:
      '1': { name: markup.heading.marker.better-mdx }
      '2': { name: markup.heading.text.better-mdx }

  # Bold text
  bold_text:
    name: markup.bold.better-mdx
    match: '\\*\\*([^*]+)\\*\\*'
    captures:
      '1': { name: markup.bold.text.better-mdx }

  # Italic text
  italic_text:
    name: markup.italic.better-mdx
    match: '\\*([^*]+)\\*'
    captures:
      '1': { name: markup.italic.text.better-mdx }

  # Comments
  comments:
    patterns:
      - name: comment.line.double-slash.better-mdx
        match: '//.*$'
      - name: comment.block.better-mdx
        begin: '/\\*'
        end: '\\*/'
        beginCaptures:
          '0': { name: punctuation.definition.comment.begin.better-mdx }
        endCaptures:
          '0': { name: punctuation.definition.comment.end.better-mdx }

  # Strings
  strings:
    patterns:
      - name: string.quoted.double.better-mdx
        begin: '"'
        end: '"'
        beginCaptures:
          '0': { name: punctuation.definition.string.begin.better-mdx }
        endCaptures:
          '0': { name: punctuation.definition.string.end.better-mdx }
        patterns:
          - name: constant.character.escape.better-mdx
            match: '\\\\.'
      - name: string.quoted.single.better-mdx
        begin: "'"
        end: "'"
        beginCaptures:
          '0': { name: punctuation.definition.string.begin.better-mdx }
        endCaptures:
          '0': { name: punctuation.definition.string.end.better-mdx }
        patterns:
          - name: constant.character.escape.better-mdx
            match: '\\\\.'
      - name: string.template.better-mdx
        begin: '`'
        end: '`'
        beginCaptures:
          '0': { name: punctuation.definition.string.begin.better-mdx }
        endCaptures:
          '0': { name: punctuation.definition.string.end.better-mdx }
        patterns:
          - include: '#interpolation'

  # Keywords
  keywords:
    name: keyword.control.better-mdx
    match: '\\b(if|else|while|for|return|const|let|var|function|class|interface|type|enum|async|await|import|export|from|default|extends|implements)\\b'

  # JSX patterns (simplified)
  jsx:
    patterns:
      - include: '#jsx-tag'

  jsx-tag:
    name: meta.tag.better-mdx
    begin: '(<)([a-zA-Z][a-zA-Z0-9]*)(?=\\s|>)'
    end: '(/>)|(</\\2>)'
    beginCaptures:
      '1': { name: punctuation.definition.tag.begin.better-mdx }
      '2': { name: entity.name.tag.better-mdx }
    endCaptures:
      '1': { name: punctuation.definition.tag.end.better-mdx }
      '2': { name: punctuation.definition.tag.begin.better-mdx }
      '3': { name: entity.name.tag.better-mdx }
      '4': { name: punctuation.definition.tag.end.better-mdx }
    patterns:
      - include: '#jsx-tag-attributes'
      - include: '#jsx-children'

  jsx-children:
    patterns:
      - include: '#jsx-tag'
      - include: '#jsx-evaluated-code'

  jsx-evaluated-code:
    contentName: meta.embedded.expression.better-mdx
    begin: '\\{'
    end: '\\}'
    beginCaptures:
      '0': { name: punctuation.section.embedded.begin.better-mdx }
    endCaptures:
      '0': { name: punctuation.section.embedded.end.better-mdx }
    patterns:
      - include: '#expressions'

  jsx-tag-attributes:
    name: meta.tag.attributes.better-mdx
    begin: '\\s+'
    end: '(?=[/]?>)'
    patterns:
      - include: '#jsx-attribute-name'
      - include: '#jsx-attribute-assignment'
      - include: '#strings'
      - include: '#jsx-evaluated-code'

  jsx-attribute-name:
    name: entity.other.attribute-name.better-mdx
    match: '([a-zA-Z][a-zA-Z0-9]*)(?=\\s*=)'

  jsx-attribute-assignment:
    name: keyword.operator.assignment.better-mdx
    match: "=(?=\\s*(?:'|\"|{|/\\*|//|\\n))"

  # TypeScript expression patterns
  ternary_operators:
    name: meta.ternary.better-mdx
    begin: '\\?'
    end: ':'
    patterns:
      - include: '#expressions'

  function_calls:
    name: meta.function.call.better-mdx
    match: '([a-zA-Z_$][a-zA-Z0-9_$]*)\\s*\\('
    captures:
      '1': { name: entity.name.function.better-mdx }

  variable_references:
    name: variable.other.better-mdx
    match: '\\b[a-zA-Z_$][a-zA-Z0-9_$]*\\b'

  parameter_list:
    name: meta.parameter.list.better-mdx
    begin: '\\('
    end: '\\)'
    patterns:
      - include: '#type_annotations'
      - include: '#variable_references'

  type_annotations:
    name: meta.type.annotation.better-mdx
    match: ':\\s*[a-zA-Z_$][a-zA-Z0-9_$<>\\[\\]|\\s,]*'


  code_blocks:
    name: markup.code.block.better-mdx
    begin: '```'
    end: '```'
    beginCaptures:
      '0': { name: punctuation.definition.code.begin.better-mdx }
    endCaptures:
      '0': { name: punctuation.definition.code.end.better-mdx }

  inline_code:
    name: markup.code.inline.better-mdx
    match: '`[^`]+`'
    captures:
      '0': { name: punctuation.definition.code.better-mdx }
