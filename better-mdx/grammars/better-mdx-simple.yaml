# Better MDX Grammar Definition - Simplified Version
# This YAML file defines the syntax highlighting patterns for Better MDX files
# It will be compiled to tmLanguage.json format for VS Code and other editors

name: Better-mdx
scopeName: source.better-mdx
fileTypes: [bettermdx, bmdx]

# Main patterns array - these are matched in order
patterns:
  # First match functions with MDX return statements
  - include: '#function_with_mdx_return'
  # Then fallback to regular TypeScript for everything else
  - include: 'source.tsx'

# Repository of named patterns
repository:
  # Function with MDX return statement
  function_with_mdx_return:
    name: meta.function.mdx.better-mdx
    begin: '^\\s*(export\\s+)?(async\\s+)?(function|const|let|var)\\s+([a-zA-Z_$][a-zA-Z0-9_$]*)\\s*[\\(=]'
    end: '^\\s*\\}\\s*$'
    beginCaptures:
      '1': { name: keyword.control.export.better-mdx }
      '2': { name: keyword.control.async.better-mdx }
      '3': { name: keyword.control.better-mdx }
      '4': { name: entity.name.function.better-mdx }
    patterns:
      - include: '#mdx_return_content'
      - include: 'source.tsx'


  # MDX content inside return statement
  mdx_return_content:
    name: meta.mdx.content.better-mdx
    begin: '\\breturn\\s*\\('
    end: '^\s*\)\s*;?\s*$'
    beginCaptures:
      '0': { name: keyword.control.return.better-mdx }
    endCaptures:
      '0': { name: keyword.control.return.better-mdx }
    contentName: text.html.markdown.better-mdx
    patterns:
      - include: '#interpolation'
      - include: '#expressions'
      - include: '#jsx_elements'
      - include: '#mdx_block'
      - include: '#mdx_inline'

  # String interpolation patterns {{ }}
  interpolation:
    name: meta.interpolation.better-mdx
    begin: '\\{\\{'
    end: '\\}\\}'
    beginCaptures:
      '0': { name: punctuation.definition.interpolation.begin.better-mdx }
    endCaptures:
      '0': { name: punctuation.definition.interpolation.end.better-mdx }
    contentName: source.ts.embedded.better-mdx
    patterns:
      - include: 'source.tsx'

  interpolation_content:
    name: variable.other.interpolation.better-mdx
    match: '[^}]+'
    patterns:
      - include: '#variable_references'
      - include: '#strings'
      - include: '#comments'

  # JavaScript expressions { }
  expressions:
    name: meta.expression.better-mdx
    begin: '\\{(?!\\{)'
    end: '\\}'
    beginCaptures:
      '0': { name: punctuation.definition.expression.begin.better-mdx }
    endCaptures:
      '0': { name: punctuation.definition.expression.end.better-mdx }
    contentName: source.tsx.embedded.better-mdx
    patterns:
      - include: '#mdx_jsx_expression_content'

  # JSX expression content with special handling for ternary operators
  mdx_jsx_expression_content:
    patterns:
      - include: '#mdx_ternary_expression'
      - include: 'source.tsx'

  # Ternary expressions with markdown content in parentheses
  mdx_ternary_expression:
    name: meta.conditional.better-mdx
    begin: '\\s*(\\w+)\\s*(\\?)\\s*(\\()'
    end: '\\)'
    beginCaptures:
      '1': { name: variable.other.readwrite.tsx }
      '2': { name: keyword.operator.ternary.tsx }
      '3': { name: punctuation.section.group.begin.better-mdx }
    endCaptures:
      '0': { name: punctuation.section.group.end.better-mdx }
    contentName: text.html.markdown.better-mdx
    patterns:
      - include: '#mdx_block'
      - include: '#mdx_inline'
      - match: '\\)\\s*(:)\\s*(\\()'
        captures:
          '1': { name: keyword.operator.ternary.tsx }
          '2': { name: punctuation.section.group.begin.better-mdx }
        push:
          - match: '\\)'
            captures:
              '0': { name: punctuation.section.group.end.better-mdx }
            pop: true
          - include: '#mdx_block'
          - include: '#mdx_inline'

  # JSX elements like <List items={items} />
  jsx_elements:
    name: meta.jsx.element.better-mdx
    begin: '<([a-zA-Z][a-zA-Z0-9]*)'
    end: '/?>'
    beginCaptures:
      '0': { name: punctuation.definition.tag.begin.better-mdx }
      '1': { name: entity.name.tag.better-mdx }
    endCaptures:
      '0': { name: punctuation.definition.tag.end.better-mdx }
    patterns:
      - include: '#jsx_attributes'
      - include: 'source.tsx'

  # JSX attributes
  jsx_attributes:
    patterns:
      - name: meta.jsx.attribute.better-mdx
        match: "([a-zA-Z][a-zA-Z0-9]*)\\s*=\\s*\\{"
        captures:
          '1': { name: entity.other.attribute-name.better-mdx }
        push:
          - match: '\\}'
            pop: true
          - include: 'source.tsx'
      - name: meta.jsx.attribute.better-mdx
        match: "([a-zA-Z][a-zA-Z0-9]*)\\s*=\\s*(\"[^\"]*\"|'[^']*')"
        captures:
          '1': { name: entity.other.attribute-name.better-mdx }
          '2': { name: string.quoted.attribute.better-mdx }

  # Function declarations
  function_declarations:
    name: meta.function.declaration.better-mdx
    begin: '\\b(function|const|let|var)\\s+([a-zA-Z_$][a-zA-Z0-9_$]*)\\s*\\('
    end: '(?=\\{|;|$)'
    beginCaptures:
      '1': { name: keyword.control.better-mdx }
      '2': { name: entity.name.function.better-mdx }
    patterns:
      - include: '#parameter_list'
      - include: '#type_annotations'

  # Import statements
  imports:
    name: meta.import.better-mdx
    begin: '\\bimport\\b'
    end: ';'
    beginCaptures:
      '0': { name: keyword.control.import.better-mdx }
    patterns:
      - include: '#import_specifiers'
      - include: '#module_paths'

  # Markdown syntax
  markdown:
    patterns:
      - include: '#headers'
      - include: '#bold_text'
      - include: '#italic_text'
      - include: '#code_blocks'
      - include: '#inline_code'

  # Headers
  headers:
    name: markup.heading.better-mdx
    match: '^(#{1,6})\\s+(.+)$'
    captures:
      '1': { name: markup.heading.marker.better-mdx }
      '2': { name: markup.heading.text.better-mdx }

  # Bold text
  bold_text:
    name: markup.bold.better-mdx
    match: '\\*\\*([^*]+)\\*\\*'
    captures:
      '1': { name: markup.bold.text.better-mdx }

  # Italic text
  italic_text:
    name: markup.italic.better-mdx
    match: '\\*([^*]+)\\*'
    captures:
      '1': { name: markup.italic.text.better-mdx }

  # Comments
  comments:
    patterns:
      - name: comment.line.double-slash.better-mdx
        match: '//.*$'
      - name: comment.block.better-mdx
        begin: '/\\*'
        end: '\\*/'
        beginCaptures:
          '0': { name: punctuation.definition.comment.begin.better-mdx }
        endCaptures:
          '0': { name: punctuation.definition.comment.end.better-mdx }

  # Strings
  strings:
    patterns:
      - name: string.quoted.double.ts
        begin: '"'
        end: '"'
        beginCaptures:
          '0': { name: punctuation.definition.string.begin.ts }
        endCaptures:
          '0': { name: punctuation.definition.string.end.ts }
        patterns:
          - name: constant.character.escape.ts
            match: '\\\\.'
      - name: string.quoted.single.ts
        begin: "'"
        end: "'"
        beginCaptures:
          '0': { name: punctuation.definition.string.begin.ts }
        endCaptures:
          '0': { name: punctuation.definition.string.end.ts }
        patterns:
          - name: constant.character.escape.ts
            match: '\\\\.'
      - name: string.template.ts
        begin: '`'
        end: '`'
        beginCaptures:
          '0': { name: punctuation.definition.string.begin.ts }
        endCaptures:
          '0': { name: punctuation.definition.string.end.ts }
        patterns:
          - include: '#interpolation'

  # Keywords
  keywords:
    name: keyword.control.better-mdx
    match: '\\b(if|else|while|for|return|const|let|var|function|class|interface|type|enum|async|await|import|export|from|default|extends|implements)\\b'

  # Additional pattern groups
  parameter_list:
    name: meta.parameter.list.better-mdx
    begin: '\\('
    end: '\\)'
    patterns:
      - include: '#type_annotations'
      - include: '#variable_references'

  type_annotations:
    name: meta.type.annotation.better-mdx
    match: ':\\s*[a-zA-Z_$][a-zA-Z0-9_$<>\\[\\]|\\s,]*'

  import_specifiers:
    name: meta.import.specifier.better-mdx
    match: '\\{[^}]+\\}'

  module_paths:
    name: string.quoted.module.better-mdx
    match: "[\"'][^\"']+[\"']"

  code_blocks:
    name: markup.code.block.better-mdx
    begin: '```'
    end: '```'
    beginCaptures:
      '0': { name: punctuation.definition.code.begin.better-mdx }
    endCaptures:
      '0': { name: punctuation.definition.code.end.better-mdx }

  inline_code:
    name: markup.code.inline.better-mdx
    match: '`[^`]+`'
    captures:
      '0': { name: punctuation.definition.code.better-mdx }

  variable_references:
    name: variable.other.better-mdx
    match: '\\b[a-zA-Z_$][a-zA-Z0-9_$]*\\b'

  # MDX Block patterns (adapted from md-reference.yaml)
  mdx_block:
    patterns:
      - include: '#mdx_heading'
      - include: '#mdx_blockquote'
      - include: '#mdx_lists'
      - include: '#mdx_fenced_code_block'
      - include: '#mdx_raw_block'
      - include: '#mdx_separator'
      - include: '#mdx_table'
      - include: '#mdx_paragraph'

  # Headings
  mdx_heading:
    match: '(?:^|\\G)[ ]{0,3}(#{1,6}\\s+(.*?)(\\s+#{1,6})?\\s*)$'
    captures:
      '1':
        patterns:
        - match: '(#{6})\\s+(.*?)(?:\\s+(#+))?\\s*$'
          name: 'heading.6.markdown'
          captures:
            '1': { name: punctuation.definition.heading.markdown }
            '2':
              name: entity.name.section.markdown
              patterns: [ { include: '#mdx_inline' } ]
            '3': { name: punctuation.definition.heading.markdown }
        - match: '(#{5})\\s+(.*?)(?:\\s+(#+))?\\s*$'
          name: 'heading.5.markdown'
          captures:
            '1': { name: punctuation.definition.heading.markdown }
            '2':
              name: entity.name.section.markdown
              patterns: [ { include: '#mdx_inline' } ]
            '3': { name: punctuation.definition.heading.markdown }
        - match: '(#{4})\\s+(.*?)(?:\\s+(#+))?\\s*$'
          name: 'heading.4.markdown'
          captures:
            '1': { name: punctuation.definition.heading.markdown }
            '2':
              name: entity.name.section.markdown
              patterns: [ { include: '#mdx_inline' } ]
            '3': { name: punctuation.definition.heading.markdown }
        - match: '(#{3})\\s+(.*?)(?:\\s+(#+))?\\s*$'
          name: 'heading.3.markdown'
          captures:
            '1': { name: punctuation.definition.heading.markdown }
            '2':
              name: entity.name.section.markdown
              patterns: [ { include: '#mdx_inline' } ]
            '3': { name: punctuation.definition.heading.markdown }
        - match: '(#{2})\\s+(.*?)(?:\\s+(#+))?\\s*$'
          name: 'heading.2.markdown'
          captures:
            '1': { name: punctuation.definition.heading.markdown }
            '2':
              name: entity.name.section.markdown
              patterns: [ { include: '#mdx_inline' } ]
            '3': { name: punctuation.definition.heading.markdown }
        - match: '(#{1})\\s+(.*?)(?:\\s+(#+))?\\s*$'
          name: 'heading.1.markdown'
          captures:
            '1': { name: punctuation.definition.heading.markdown }
            '2':
              name: entity.name.section.markdown
              patterns: [ { include: '#mdx_inline' } ]
            '3': { name: punctuation.definition.heading.markdown }
    name: markup.heading.markdown

  # Blockquotes
  mdx_blockquote:
    begin: '(^|\\G)[ ]{0,3}(>) ?'
    captures:
      '2': { name: punctuation.definition.quote.begin.markdown }
    name: markup.quote.markdown
    patterns:
      - include: '#mdx_block'
    while: '(^|\\G)\\s*(>) ?'

  # Lists
  mdx_lists:
    patterns:
    - begin: '(^|\\G)([ ]{0,3})([*+-])([ \\t])'
      beginCaptures:
        '3': { name: punctuation.definition.list.begin.markdown }
      name: markup.list.unnumbered.markdown
      patterns:
        - include: '#mdx_block'
        - include: '#mdx_list_paragraph'
      while: '((^|\\G)([ ]{2,4}|\\t))|(^[ \\t]*$)'
    - begin: '(^|\\G)([ ]{0,3})([0-9]+[\\.\)])([ \\t])'
      beginCaptures:
        '3': { name: punctuation.definition.list.begin.markdown }
      name: markup.list.numbered.markdown
      patterns:
        - include: '#mdx_block'
        - include: '#mdx_list_paragraph'
      while: '((^|\\G)([ ]{2,4}|\\t))|(^[ \\t]*$)'

  # List paragraphs
  mdx_list_paragraph:
    begin: '(^|\\G)(?=\\S)(?![*+->]\\s|[0-9]+\\.\\s)'
    name: meta.paragraph.markdown
    patterns:
      - include: '#mdx_inline'
    while: '(^|\\G)(?!\\s*$|#|[ ]{0,3}([-*_>][ ]{2,}){3,}[ \\t]*$\\n?|[ ]{0,3}[*+->]|[ ]{0,3}[0-9]+\\.)'

  # Fenced code blocks
  mdx_fenced_code_block:
    begin: '(^|\\G)(\\s*)(`{3,}|~{3,})\\s*(?=([^`]*)?$)'
    beginCaptures:
      '3': { name: punctuation.definition.markdown }
      '4': { name: fenced_code.block.language }
    end: '(^|\\G)(\\2|\\s{0,3})(\\3)\\s*$'
    endCaptures:
      '3': { name: punctuation.definition.markdown }
    name: markup.fenced_code.block.markdown

  # Raw blocks (indented code)
  mdx_raw_block:
    begin: '(^|\\G)([ ]{4}|\\t)'
    name: markup.raw.block.markdown
    while: '(^|\\G)([ ]{4}|\\t)'

  # Horizontal rules
  mdx_separator:
    match: '(^|\\G)[ ]{0,3}([\\*\\-\\_])([ ]{0,2}\\2){2,}[ \\t]*$\\n?'
    name: meta.separator.markdown

  # Tables
  mdx_table:
    name: markup.table.markdown
    begin: '(^|\\G)(\\|)(?=[^|].+\\|\\s*$)'
    beginCaptures:
      '2': { name: punctuation.definition.table.markdown }
    while: '(^|\\G)(?=\\|)'
    patterns:
      - match: '\\|'
        name: punctuation.definition.table.markdown
      - match: '(?<=\\|)\\s*(:?-+:?)\\s*(?=\\|)'
        captures:
          '1': { name: punctuation.separator.table.markdown }
      - match: '(?<=\\|)\\s*(?=\\S)((\\\\\\||[^|])+)(?<=\\S)\\s*(?=\\|)'
        captures:
          '1':
            patterns:
              - include: '#mdx_inline'

  # Paragraphs
  mdx_paragraph:
    begin: '(^|\\G)[ ]{0,3}(?=[^ \\t\\n])'
    name: meta.paragraph.markdown
    patterns:
      - include: '#mdx_inline'
    while: '(^|\\G)((?=\\s*[-=]{3,}\\s*$)|[ ]{4,}(?=[^ \\t\\n]))'

  # Inline patterns (adapted from md-reference.yaml)
  mdx_inline:
    patterns:
      - include: '#interpolation'
      - include: '#expressions'
      - include: '#jsx_elements'
      - include: '#mdx_ampersand'
      - include: '#mdx_bracket'
      - include: '#mdx_bold'
      - include: '#mdx_italic'
      - include: '#mdx_raw'
      - include: '#mdx_strikethrough'
      - include: '#mdx_escape'
      - include: '#mdx_image_inline'
      - include: '#mdx_link_email'
      - include: '#mdx_link_inet'
      - include: '#mdx_link_inline'

  # Bold text
  mdx_bold:
    name: markup.bold.markdown
    begin: '(\\*\\*|__)(?=\\S)'
    end: '(?<=\\S)(\\1)'
    beginCaptures:
      '1': { name: punctuation.definition.bold.markdown }
    endCaptures:
      '1': { name: punctuation.definition.bold.markdown }
    patterns:
      - include: '#mdx_escape'
      - include: '#mdx_raw'
      - include: '#mdx_italic'

  # Italic text
  mdx_italic:
    name: markup.italic.markdown
    begin: '(\\*|_)(?=\\S)'
    end: '(?<=\\S)(\\1)'
    beginCaptures:
      '1': { name: punctuation.definition.italic.markdown }
    endCaptures:
      '1': { name: punctuation.definition.italic.markdown }
    patterns:
      - include: '#mdx_escape'
      - include: '#mdx_raw'

  # Inline code
  mdx_raw:
    captures:
      '1': { name: punctuation.definition.raw.markdown }
      '3': { name: punctuation.definition.raw.markdown }
    match: '(`+)((?:[^`]|(?!(?<!`)\\1(?!`))`)*+)(\\1)'
    name: markup.inline.raw.string.markdown

  # Strikethrough
  mdx_strikethrough:
    captures:
      '1': { name: punctuation.definition.strikethrough.markdown }
      '2':
        patterns:
          - include: '#mdx_escape'
          - include: '#mdx_ampersand'
          - include: '#mdx_bracket'
          - include: '#mdx_raw'
          - include: '#mdx_bold'
          - include: '#mdx_italic'
          - include: '#mdx_image_inline'
          - include: '#mdx_link_inline'
          - include: '#mdx_link_inet'
          - include: '#mdx_link_email'
      '3': { name: punctuation.definition.strikethrough.markdown }
    match: '(?<!\\\\)(~{2,})(?!(?<=\\w~~)_)((?:[^~]|(?!(?<![~\\\\])\\1(?!~))~)*+)(\\1)(?!(?<=_\\1)\\w)'
    name: markup.strikethrough.markdown

  # Escape sequences
  mdx_escape:
    match: '\\\\[-`*_#+.!(){}\\[\\]\\\\>]'
    name: constant.character.escape.markdown

  # Ampersands
  mdx_ampersand:
    match: '&(?!([a-zA-Z0-9]+|#[0-9]+|#x[0-9a-fA-F]+);)'
    name: meta.other.valid-ampersand.markdown

  # Brackets
  mdx_bracket:
    match: '<(?![a-zA-Z/?\\$!])'
    name: meta.other.valid-bracket.markdown

  # Inline images
  mdx_image_inline:
    name: meta.image.inline.markdown
    match: '!\\[([^\\]]*)\\]\\(([^)]+)\\)'
    captures:
      '1': { name: string.other.link.description.markdown }
      '2': { name: markup.underline.link.image.markdown }

  # Email links
  mdx_link_email:
    captures:
      '1': { name: punctuation.definition.link.markdown }
      '2': { name: markup.underline.link.markdown }
      '3': { name: punctuation.definition.link.markdown }
    match: "(<)((?:mailto:)?[a-zA-Z0-9.!#$%&'*+/=?^_`{|}~-]+@[a-zA-Z0-9-]+(?:\\.[a-zA-Z0-9-]+)*)(>)"
    name: meta.link.email.lt-gt.markdown

  # Internet links
  mdx_link_inet:
    captures:
      '1': { name: punctuation.definition.link.markdown }
      '2': { name: markup.underline.link.markdown }
      '3': { name: punctuation.definition.link.markdown }
    match: '(<)((?:https?|ftp)://.*?)(>)'
    name: meta.link.inet.markdown

  # Inline links
  mdx_link_inline:
    name: meta.link.inline.markdown
    match: '\\[([^\\]]*)\\]\\(([^)]+)\\)'
    captures:
      '1': 
        name: string.other.link.title.markdown
        patterns:
          - include: '#mdx_raw'
          - include: '#mdx_bold'
          - include: '#mdx_italic'
      '2': { name: markup.underline.link.markdown }

